name: CI Pipeline

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: "oc_lettings_site.settings"
      DATABASE_URL: "sqlite:///oc-lettings-site.sqlite3"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.txt

      - name: Write .env file
        run: |
          echo "SECRET_KEY='${{ secrets.SECRET_KEY }}'" > .env
          echo "SENTRY_DSN='${{ secrets.SENTRY_DSN }}'" >> .env
          echo "DJANGO_ALLOWED_HOSTS='${{ secrets.DJANGO_ALLOWED_HOSTS }}'" >> .env

      - name: Run linting
        run: |
          pip install flake8
          flake8 .

      - name: Run tests with coverage
        run: |
          pip install coverage
          coverage run manage.py test
          coverage report
          coverage xml
        continue-on-error: true

      - name: Check coverage threshold
        run: |
          coverage report --fail-under=80

      - name: Collect static files
        run: |
          source .env
          python manage.py collectstatic --noinput

      - name: Upload codebase artifact
        uses: actions/upload-artifact@v4
        with:
          path: .
          name: codebase

  cd:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Download codebase artifact
        uses: actions/download-artifact@v4
        with:
          name: codebase

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mydjangoapp

      - name: Write .env file
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: ".env"
          target: "$HOME/app/"
          overwrite: true

      - name: Deploy to VPS using Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/mydjangoapp
            sudo docker stop mydjangoapp || true
            sudo docker rm mydjangoapp || true
            sudo fuser -k 8000/tcp || true
            sudo docker run -d --name mydjangoapp -p 8000:8000 \
              --env-file $HOME/app/.env \
              ${{ secrets.DOCKER_USERNAME }}/mydjangoapp