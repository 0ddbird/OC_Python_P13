# .github/workflows/cd.yml
name: CD Job

on:
  workflow_call:
jobs:
  cd:
    runs-on: ubuntu-latest
    steps:
      - name: Download codebase artifact
        uses: actions/download-artifact@v4
        with:
          name: codebase

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mydjangoapp

      - name: Write .env file
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: ".env"
          target: "$HOME/app/"
          overwrite: true

      - name: Deploy to VPS using Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/mydjangoapp
            sudo docker stop mydjangoapp || true
            sudo docker rm mydjangoapp || true
            sudo fuser -k 8000/tcp || true
            sudo docker run -d --name mydjangoapp -p 8000:8000 \
              --env-file $HOME/app/.env \
              ${{ secrets.DOCKER_USERNAME }}/mydjangoapp
