version: '3'

services:
  django:
    image: 0ddbird/mydjangoapp:$COMMIT_SHA
    container_name: django
    environment:
      - DJANGO_SETTINGS_MODULE=oc_lettings_site.settings
    volumes:
      - staticfiles:/app/static
    ports:
      - "8000:8000"
    env_file:
      - /app/.env

  caddy:
    image: caddy:latest
    container_name: caddy
    volumes:
      - staticfiles:/srv/mydjangoapp/static
      - ./Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"

volumes:
  staticfiles:
